  <script defer src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="env" data-plugins="transform-react-jsx">
/** @jsxRuntime classic */
/** @jsx elementBuilder */
/** @jsxFrag elementBuilder.fragment */

const app = document.getElementById("app");


/**
 * elementBuilder.js — Custom JSX factory. *
 * The transpiler calls the factory in two ways:
 *   elementBuilder(tag, props, ...children)
 *   elementBuilder.fragment(...children) // for <></>
 */

const SVG_NS = "http://www.w3.org/2000/svg";

/**
 * Tags that belong to the SVG namespace.
 * Ambiguous tags shared with HTML are intentionally excluded.
 */
const svgOnlyTags = new Set([
  "svg",
  "circle",
  "path",
  "rect",
  "line",
  "polyline",
  "polygon",
  "ellipse",
  "g",
  "defs",
  "use",
  "symbol",
  "text",
  "tspan",
  "textPath",
  "image",
  "foreignObject",
  "mask",
  "clipPath",
  "pattern",
  "linearGradient",
  "radialGradient",
  "stop",
  "filter",
  "feGaussianBlur",
  "feColorMatrix",
  "animate",
  "animateTransform",
  "animateMotion",
  "marker",
  "view",
  "switch",
]);

function ElementBuilder(tag) {
  this.struct = {
    tag: null,
    attributes: {},
    styles: {},
    events: {},
    children: [],
  };

  this.node = null;

  if (tag && tag.nodeType === 1) {
    this.struct.tag = tag.tagName.toLowerCase();
    this.node = tag;
  } else {
    this.struct.tag = tag;
  }
}

ElementBuilder.prototype.setAttributes = function(attrs) {
  this.struct.attributes = { ...this.struct.attributes, ...attrs };

  if (this.node) {
    this.node.setAttributes(attrs);
  }

  return this;
};

ElementBuilder.prototype.setStyles = function(styles) {
  this.struct.styles = { ...this.struct.styles, ...styles };

  if (this.node) {
    this.node.setStyles(styles);
  }

  return this;
};

ElementBuilder.prototype.setEvents = function(events) {
  this.struct.events = { ...this.struct.events, ...events };

  if (this.node) {
    this.node.setEvents(events);
  }

  return this;
};

ElementBuilder.prototype.setChildren = function(children) {
  const nextChildren = (Array.isArray(children) ? children : [children]).flat(Infinity);

  if (this.node) {
    this._reconcileChildren(nextChildren);
  } else {
    this.struct.children = nextChildren;
  }

  return this;
};

ElementBuilder.prototype._createNode = function() {
  if (this.node) {
    return this.node;
  }

  this.node = svgOnlyTags.has(this.struct.tag)
    ? document.createElementNS(SVG_NS, this.struct.tag)
    : document.createElement(this.struct.tag);

  if (Object.keys(this.struct.attributes).length) {
    this.node.setAttributes(this.struct.attributes);
  }
  if (Object.keys(this.struct.styles).length) {
    this.node.setStyles(this.struct.styles);
  }
  if (Object.keys(this.struct.events).length) {
    this.node.setEvents(this.struct.events);
  }

  this._reconcileChildren(this.struct.children);
  return this.node;
};

ElementBuilder.prototype._reconcileChildren = function(nextChildren) {
  const previousChildren = this.struct.children;
  const retainedChildren = [];

  for (let index = 0; index < nextChildren.length; index += 1) {
    const nextChild = nextChildren[index];
    const currentChild = previousChildren[index];
    const currentNode = this.node.childNodes[index] ?? null;

    if (
      currentChild instanceof ElementBuilder &&
      nextChild instanceof ElementBuilder &&
      currentChild.struct.tag === nextChild.struct.tag &&
      currentNode &&
      currentNode.nodeType === 1
    ) {
      currentChild.node = currentNode;
      currentChild._patchFrom(nextChild);
      retainedChildren.push(currentChild);
      continue;
    }

    if (
      (typeof currentChild === "string" || typeof currentChild === "number") &&
      (typeof nextChild === "string" || typeof nextChild === "number") &&
      currentNode?.nodeType === Node.TEXT_NODE
    ) {
      const nextText = String(nextChild);
      if (currentNode.nodeValue !== nextText) {
        if (
          nextChildren.length === 1 &&
          typeof this.node.setText === "function"
        ) {
          this.node.setText(nextText);
        } else {
          currentNode.nodeValue = nextText;
        }
      }
      retainedChildren.push(nextChild);
      continue;
    }

    const nextNode = nextChild instanceof ElementBuilder
      ? nextChild._createNode()
      : nextChild?.nodeType
        ? nextChild
        : document.createTextNode(
            nextChild == null || typeof nextChild === "boolean"
              ? ""
              : String(nextChild)
          );

    if (currentNode) {
      this.node.replaceChild(nextNode, currentNode);
    } else {
      this.node.appendChild(nextNode);
    }
    retainedChildren.push(nextChild);
  }

  while (this.node.childNodes.length > nextChildren.length) {
    this.node.removeChild(this.node.lastChild);
  }

  this.struct.children = retainedChildren;
};

ElementBuilder.prototype._patchFrom = function(next) {
  const previousAttributes = this.struct.attributes;
  const nextAttributes = next.struct.attributes;
  for (const name of Object.keys(previousAttributes)) {
    if (!(name in nextAttributes)) {
      this.node.removeAttribute(name);
    }
  }
  const changedAttributes = {};
  for (const [name, value] of Object.entries(nextAttributes)) {
    if (!Object.is(previousAttributes[name], value)) {
      changedAttributes[name] = value;
    }
  }
  if (Object.keys(changedAttributes).length) {
    this.node.setAttributes(changedAttributes);
  }

  const previousStyles = this.struct.styles;
  const nextStyles = next.struct.styles;
  for (const name of Object.keys(previousStyles)) {
    if (!(name in nextStyles)) {
      this.node.style[name] = "";
    }
  }
  const changedStyles = {};
  for (const [name, value] of Object.entries(nextStyles)) {
    if (!Object.is(previousStyles[name], value)) {
      changedStyles[name] = value;
    }
  }
  if (Object.keys(changedStyles).length) {
    this.node.setStyles(changedStyles);
  }

  if (!sameEventMap(this.struct.events, next.struct.events)) {
    for (const name of Object.keys(this.struct.events)) {
      if (!(name in next.struct.events)) {
        const handler = this.node.__dompp_handlers?.[name];
        if (handler) {
          this.node.removeEventListener(name, handler);
          delete this.node.__dompp_handlers[name];
        }
      }
    }
    this.node.setEvents(next.struct.events);
  }

  const previousChildren = this.struct.children;
  this.struct = {
    tag: next.struct.tag,
    attributes: { ...nextAttributes },
    styles: { ...nextStyles },
    events: { ...next.struct.events },
    children: previousChildren,
  };
  this._reconcileChildren(next.struct.children);
  return this;
};

function sameEventMap(left, right) {
  const leftKeys = Object.keys(left);
  const rightKeys = Object.keys(right);
  return leftKeys.length === rightKeys.length &&
    leftKeys.every((key) => left[key] === right[key]);
}

ElementBuilder.prototype.toNode = function() {
  return this._createNode();
};

// ignore it first!
// ElementBuilder.prototype.fragment = function(...childrn) {
//   this.struct.children = Array.isArray(childrn) ? childrn : [childrn];

//   if (this.node !== null) {
//     const node = document.createDocumentFragment();

//     if (children.length) {
//       node.setChildren(this.struct.children);
//     }
//   }
// };

// JSX factory: elementBuilder(tag, props, ...children)
function elementBuilder(tag, props, ...children) {

  // Custom components.
  if (typeof tag === "function") {
    return tag(props, ...children);
  }

  const element = new ElementBuilder(tag);

  if (props) {
    const attrs = {};
    const events = {};

    let style;
    let className;

    for (const [key, value] of Object.entries(props)) {
      const normalizedKey = key.toLowerCase();

      // Event props: onClick, onclick, ONCLICK, OnClick, etc.
      if (normalizedKey.startsWith("on")) {
        const eventName = normalizedKey.slice(2);

        if (eventName) {
          events[eventName] = value;
        }
      } else if (
        normalizedKey === "styles" ||
        normalizedKey === "style"
      ) {
        style = value;
      } else if (
        normalizedKey === "classname" ||
        normalizedKey === "class"
      ) {
        className ??= value;
      } else {
        attrs[key] = value;
      }
    }

    if (className != null) {
      element.setAttributes({ class: className });
    }

    if (style != null) {
      element.setStyles(style);
    }

    if (Object.keys(events).length) {
      element.setEvents(events);
    }

    if (Object.keys(attrs).length) {
      element.setAttributes(attrs);
    }
  }

  // Append children.
  if (children.length) {
    element.setChildren(children);
  }

  return element;
}

function CounterElement({ count }) {
  return (
    <div className="card">
      <h3 style={{
        backgroundColor: count % 2 === 0 ? "purple" : "fuchsia",
        color: "white",
      }}>{count}</h3>
      <button
        class="secondary"
        onClick={() => console.log(count)}
      >UPDATE</button>
      <hr />
      <fragment>Hello, I'm just a Fragment!</fragment>
    </div>
  );
}

let count = 0;

function ComponentBuilder(builder) {
  let component = null;

  const instance = {
    render() {
      if (!component) {
        component = builder(() => instance.rerender());
      }

      return component.toNode();
    },

    rerender() {
      if (!component) {
        return instance;
      }

      const next = builder(() => instance.rerender());
      if (component.struct.tag === next.struct.tag) {
        component._patchFrom(next);
      } else {
        const nextNode = next.toNode();
        if (component.node?.parentNode) {
          component.node.parentNode.replaceChild(nextNode, component.node);
        }
        component.node = nextNode;
        component.struct = next.struct;
      }

      return instance;
    },
  };

  return Object.freeze(instance);
}

const x = new ComponentBuilder((rerender) => {
  console.log("rerender!", count);
  return (
    <div
      className="card"
      style={{
        backgroundColor: count % 2 === 0 ? "purple" : "fuchsia",
        color: "white",
      }}
    >
      <h3>{count}</h3>
      <button
        class="secondary"
        disabled={count === 10}
        onClick={() => {
          count += 1;
          rerender();
        }}
      >UPDATE</button>
    </div>
  );
});

console.log("x", x);

elementBuilder(
  app,
  null,
  <CounterElement count={count} />,
  <hr />,
  x.render(),
);
  </script>
</body>

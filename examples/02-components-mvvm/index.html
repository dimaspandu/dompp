<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
  <title>Components and MVVM</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">DOM++ · Example 02</div>
      <h1>Components and MVVM</h1>
      <p><code>createComponent()</code> renders immediately and returns the rendered result with <code>.rerender()</code>. State lives in a plain ViewModel; the view subscribes and rerenders explicitly.</p>
    </header>

    <div class="examples">
      <article>
        <h2>Live Demo</h2>
        <div id="app" class="demo-surface mvvm-surface"></div>
      </article>

      <article>
        <h2>Source Code</h2>
        <details class="snippet">
          <summary>View code</summary>
          <pre><code id="source" class="language-javascript"></code></pre>
        </details>
      </article>
    </div>
  </main>

  <script type="module" src="../../src/index.js"></script>
  <script type="module">await import("./demo.js");</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script type="module">const js = await fetch("./demo.js", { headers: { Accept: "text/plain" } }).then((r) => r.text()).catch(() => fetch("./demo.compiled.js").then((r) => r.text()).catch(() => "// Source unavailable")); const block = document.getElementById("source"); block.textContent = js.trim(); hljs.highlightElement(block);</script>
</body>
</html>

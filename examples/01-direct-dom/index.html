<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
  <title>Direct DOM</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" />
  <link rel="stylesheet" href="styles.css" />
  </head>
<body>
  <div class="container">
    <h1>Direct DOM</h1>
    <p class="description"><code>setText()</code>, <code>setAttributes()</code>, <code>setStyles()</code>, <code>setEvents()</code>, and <code>setChildren()</code> mutate real DOM nodes and return the same element for chaining.</p>
    <h2>Live Demo</h2>
    <div class="panel"><div id="app" class="demo-mount"></div></div>
    <h2 style="margin-top: 48px;">Source Code</h2>
    <pre><code id="source" class="language-javascript"></code></pre>
  </div>
  <script type="module" src="../../src/index.js"></script>
  <script type="module">await import("./demo.js");</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script type="module">const js = await fetch("./demo.js", { headers: { Accept: "text/plain" } }).then((r) => r.text()).catch(() => fetch("./demo.compiled.js").then((r) => r.text()).catch(() => "// Source unavailable")); const block = document.getElementById("source"); block.textContent = js.trim(); hljs.highlightElement(block);</script>
</body>
</html>

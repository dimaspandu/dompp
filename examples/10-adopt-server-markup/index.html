<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
  <title>Adopt Server Markup</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">DOM++ · Example 10</div>
      <h1>Adopt Server Markup</h1>
      <p>Adopt existing server-rendered markup, then rerender it reactively.</p>
    </header>

    <div class="examples">
      <article>
        <h2>Live Demo</h2>
        <div id="app" class="demo-surface adoption-surface">
          <ul id="adoption-list" class="server-list">
            <li>JavaScript will adopt it</li>
            <li>This list was rendered as HTML</li>
            <li>Hello from the server</li>
          </ul>
          <script id="adoption-data" type="application/json">[{"id":1,"text":"Hello from the server"},{"id":2,"text":"This list was rendered as HTML"},{"id":3,"text":"JavaScript will adopt it"}]</script>
          <p id="adoption-status" class="status-note">Waiting for adoption...</p>
        </div>
      </article>

      <article>
        <h2>Source Code</h2>
        <details class="snippet">
          <summary>View code</summary>
          <pre><code id="source" class="language-javascript"></code></pre>
        </details>
      </article>
    </div>
  </main>

  <script type="module" src="../../src/index.js"></script>
  <script type="module">
    const isLocalhost = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    await import(isLocalhost ? "./demo.jsx" : "./demo.compiled.js");
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script type="module">const js = await fetch("./demo.jsx", { headers: { Accept: "text/plain" } }).then((r) => r.text()).catch(() => fetch("./demo.js").then((r) => r.text()).catch(() => "// Source unavailable")); const block = document.getElementById("source"); block.textContent = js.trim(); hljs.highlightElement(block);</script>
</body>
</html>
